plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'com.modrinth.minotaur' version '2.+'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

// Minecraft 26.x is unobfuscated: no mappings line, and plain `implementation`
// instead of `modImplementation`.
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// Publish to Modrinth with:  MODRINTH_TOKEN=xxx ./gradlew modrinth
// Create the project on modrinth.com first, then paste its ID/slug below.
modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "skyblock-money-advisor"
    versionNumber = project.mod_version
    versionType = "release"
    uploadFile = tasks.jar   // no remapJar on unobfuscated Minecraft
    gameVersions = [project.minecraft_version]
    loaders = ["fabric"]
    dependencies {
        required.project "fabric-api"
    }
    syncBodyFrom = rootProject.file("README.md").text
}
